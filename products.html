<!DOCTYPE html>
<html>
<head>
    <title>All Products</title>
</head>
<body>

<h1>📦 All Products</h1>

<div id="products"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "raj-mini-mart.firebaseapp.com",
  projectId: "raj-mini-mart",
  storageBucket: "raj-mini-mart.firebasestorage.app",
  messagingSenderId: "490305070206",
  appId: "1:490305070206:web:ff8214149720a7b8a1e42f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const snapshot = await getDocs(collection(db,"products"));

snapshot.forEach((d)=>{
    document.getElementById("products").innerHTML += `
    <hr>
    <p><b>ID:</b> ${d.id}</p>
    <p><b>Name:</b> ${d.data().name}</p>
    <p><b>Price:</b> ₹${d.data().price}</p>
    `;
});

</script>

</body>
</html>
