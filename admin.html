<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>நம்ம மார்ட் - Admin Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:white;
    padding:28px 24px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    text-align:center;
}

.admin-brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.admin-brand img{
    width:55px;
    height:55px;
    object-fit:contain;
    border-radius:10px;
    flex-shrink:0;
}

.admin-brand h1{
    margin:0;
    color:green;
    font-size:30px;
}

.admin-brand h2{
    margin:2px 0 0;
    color:green;
    font-size:20px;
}

.login-title{
    margin:10px 0 20px;
    color:#333;
    font-size:21px;
}

input{
    width:100%;
    padding:13px;
    margin:9px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:green;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    background:green;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
}

button:hover{
    background:#087a08;
}
</style>

</head>

<body>

<div class="login-box">

    <div class="admin-brand">
        <img src="./icon-512.png" alt="நம்ம மார்ட்">

        <div>
            <h1>நம்ம மார்ட்</h1>
            <h2>Admin</h2>
        </div>
    </div>

    <div class="login-title">
        🔐 Admin Login
    </div>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        🔐 Login
    </button>

</div>

<script>

function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if(username==="admin" && password==="1234"){

        window.location.href="dashboard.html";

    }else{

        alert("❌ Username அல்லது Password தவறு");

    }

}

</script>

</body>
</html>
