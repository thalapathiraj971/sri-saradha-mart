<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ஸ்ரீ சாரதா மார்ட் - Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

h1{
    color:green;
    text-align:center;
}

.box{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:600px;
    margin:auto;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px;
}

.cards{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    flex:1;
    min-width:150px;
    color:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
}
</style>

</head>

<body>

<h1>🛒 ஸ்ரீ சாரதா மார்ட் Admin</h1>

<div class="box">

<input type="text" id="name" placeholder="Product Name">

<input type="number" id="price" placeholder="Price">

<input type="text" id="image" placeholder="Image URL">

<input type="text" id="stock" placeholder="In Stock / Out of Stock">

<button onclick="addProduct()">
➕ Add Product
</button>

<hr>

<h2>📊 Dashboard</h2>

<div class="cards">

<div class="card" style="background:#4CAF50;">
<h3>Total Orders</h3>
<h2 id="totalOrders">0</h2>
</div>

<div class="card" style="background:#2196F3;">
<h3>Total Sales</h3>
<h2 id="totalSales">₹0</h2>
</div>

<div class="card" style="background:#FF9800;">
<h3>Pending Orders</h3>
<h2 id="pendingOrders">0</h2>
</div>
<div class="card" style="background:#F44336;">
<h3>Low Stock</h3>
<h2 id="lowStock">0</h2>
</div>
</div>

<hr>

<h3>📦 Product List</h3>

<div id="productList"></div>

<hr>

<button onclick="window.location.href='orders.html'">
📦 View Orders
</button>

<button onclick="logout()">
🚪 Logout
</button>

</div>

<script type="module" src="dashboard.js"></script>

<script>
function logout(){
    window.location.href="admin.html";
}
</script>

</body>
</html>
