<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>நம்ம மார்ட்</title>


<link rel="stylesheet" href="./style.css?v=4">

<link rel="manifest" href="./manifest.json">

<link rel="icon" type="image/png" href="./logo.png">

<link rel="apple-touch-icon" href="./logo.png">

<meta name="theme-color" content="#0097A7">
</head>

<body>

<header class="top-header">

    <div class="top-row">

        <img src="./icon-512.png"
             class="logo"
             alt="நம்ம மார்ட்"

        <div class="brand">
            <h1>நம்ம மார்ட்</h1>
            <p>🛍️ Grocery • Home Delivery</p>
        </div>

    </div>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="🔍 Search for products...">
    </div>

</header>

<div class="cart-bar">

<a href="https://wa.me/918760534354?text=வணக்கம்!%20எனக்கு%20பொருட்கள்%20ஆர்டர்%20செய்ய%20வேண்டும்."
class="btn">

📲 WhatsApp-ல் Order செய்யுங்கள்

</a>

<br><br>

🛒 Cart :
<span id="cart-count">0</span>

&nbsp; | &nbsp;

Total :
₹<span id="total">0</span>
<button onclick="viewCart()">🛒 View Cart</button>

<button id="checkoutBtn" class="checkout-btn" onclick="checkout()" disabled>
    🛍️ Checkout
</button>
</div>
  <div class="progress-box">

<h3>🛒 Minimum Order ₹500</h3>

<div class="progress">

<div id="progressFill" class="progress-fill"></div>

</div>

<p id="progressText">
₹0 / ₹500
</p>

  </div>
<main>
        <!-- 🚚 Service Highlights -->
    <div class="service-strip">

    <div class="service-item">
        <div class="service-icon">🚚</div>
        <h4>Fast Delivery</h4>
        <p>(குறைந்த நேரத்தில்)</p>
    </div>

    <div class="service-item">
        <div class="service-icon">💰</div>
        <h4>Best Price</h4>
        <p>(சிறந்த விலை)</p>
    </div>

    <div class="service-item">
        <div class="service-icon">🛡️</div>
        <h4>Fresh & Quality</h4>
        <p>(தரம் உறுதி)</p>
    </div>

    </div>
        
<div id="offerBanner"
style="background:#ff9800;
color:white;
padding:12px;
margin:15px;
border-radius:10px;
text-align:center;
font-weight:bold;">
</div>
    <!-- 🚚 Delivery Banner Slider -->
<div class="delivery-slider">

    <div class="delivery-slides">

        <img src="./namma-mart-today-delivery.png"
             alt="5 KMக்குள் Today Delivery">

        <img src="./namma-mart-next-day-delivery.png"
             alt="5 KMக்கு மேல் Next Day Delivery">

    </div>

    <div class="slider-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
    </div>

</div>
<section class="categories">

    <button onclick="loadProducts()">🛒 All</button>

    <button onclick="filterProducts('rice')">
        🍚 Rice
    </button>

    <button onclick="filterProducts('oil')">
        🛢️ Oil
    </button>

    <button onclick="filterProducts('dal')">
        🌾 Dal
    </button>

    <button onclick="filterProducts('biscuit')">
        🍪 Biscuits
    </button>

</section>

<h2 class="title">Today's Products</h2>

<div id="products" class="products">
  
</div>

</main>
    <div id="cartModal" class="cart-modal">
  <div class="cart-content">

    <h2>🛒 உங்கள் Cart</h2>

    <div id="cartList"></div>

    <h3>Total : ₹<span id="cartTotal">0</span></h3>

    <button onclick="clearCart()">🗑️ Clear Cart</button>

    <button onclick="closeCart()">❌ Close</button>

  </div>
    </div>
<button id="installBtn" style="display:none;">
📲 Install App
</button>
<script type="module" src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
}
</script>
</body>
</html>
